  '@types/node': ^22.19.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.3.0
  eslint: ^10.15.0
  eslint-config-prettier: ^10.1.8
  fastify: ^5.12.8
  globals: ^17.14.0
  prettier: ^3.10.1
  react: ^19.3.1
  react-dom: ^19.3.1
  typescript: ~6.0.3
  typescript-eslint: ^8.72.2
  vite: ^8.3.8
  vitest: ^5.1.0
  yjs: ^13.6.33

minimumReleaseAgeExclude:
  - '@eslint/config-array@0.23.6'
  - eslint@10.15.0
