packages:
  - 'packages/*'
  - 'apps/*'

# Run package scripts through pnpm's cross-platform shell, so POSIX syntax such
# as `VAR=value node …` (apps/server `dev`) also works on Windows.
shellEmulator: true

# Single source of truth for dependency versions shared across packages.
catalog:
  '@codemirror/autocomplete': ^6.20.4
  '@codemirror/commands': ^6.11.1
  '@codemirror/language': ^6.13.1
  '@codemirror/legacy-modes': ^6.5.5
  '@codemirror/search': ^6.7.2
  '@codemirror/state': ^6.7.6
  '@codemirror/view': ^6.43.15
  '@eslint/js': ^10.0.1
  '@fastify/websocket': ^11.3.7
  '@playwright/test': 1.65.0
  '@types/node': ^22.19.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/ws': ^8.18.2
  '@vitejs/plugin-react': ^6.3.0
  eslint: ~10.14.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  fastify: ^5.12.8
  fflate: ^0.8.3
  globals: ^17.14.0
  katex: ^0.19.1
  pdfjs-dist: ^6.5.438
  prettier: ^3.10.1
  react: ^19.3.1
  react-dom: ^19.3.1
  typescript: ~6.0.3
  typescript-eslint: ^8.72.2
  vite: ^8.3.8
  vitest: ^5.1.0
  yjs: ^13.6.33
