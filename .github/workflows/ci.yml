name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Enables live-preview tests (ADR 0012); built below.
      MYLEAF_TEXPRESSO: ${{ github.workspace }}/vendor/texpresso/build/bin/texpresso
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install TeX Live, TeXpresso and pdfTeX build dependencies
        # latex-extra provides mylatexformat (ADR 0011); xetex and the libraries
        # are needed to build and run TeXpresso (vendor/texpresso/README.md);
        # texinfo builds pdfTeX (vendor/pdftex/README.md).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-xetex latexmk \
            build-essential pkg-config libsdl2-dev libmupdf-dev libmujs-dev libfreetype-dev \
            libgumbo-dev libjbig2dec0-dev libjpeg-dev libopenjp2-7-dev libssl-dev \
            libfontconfig-dev libleptonica-dev libharfbuzz-dev libgraphite2-dev libicu-dev \
            libpng-dev zlib1g-dev texinfo
      - name: Build TeXpresso
        run: vendor/texpresso/build.sh
      - name: Build pdfTeX (live preview with MYLEAF_LIVE_ENGINE=pdftex)
        run: vendor/pdftex/build.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
