name: CI

on:
  # Branches are checked through their pull request; pushing to a branch with
  # an open pull request used to run everything twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Three jobs run in parallel; the slowest (unit tests, mostly the pdfTeX live
# preview suite) sets the wall time.
jobs:
  checks:
    name: Format, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      # Enables live-preview tests (ADR 0012); built by setup-tex.
      MYLEAF_TEXPRESSO: ${{ github.workspace }}/vendor/texpresso/build/bin/texpresso
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: ./.github/actions/setup-tex
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    name: Build and browser tests
    runs-on: ubuntu-latest
    env:
      MYLEAF_TEXPRESSO: ${{ github.workspace }}/vendor/texpresso/build/bin/texpresso
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: ./.github/actions/setup-tex
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
